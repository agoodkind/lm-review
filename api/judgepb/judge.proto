syntax = "proto3";
package judge.v1;
option go_package = "goodkind.io/lm-review/api/judgepb";

service Judge {
  rpc Evaluate(JudgeRequest) returns (JudgeReply);
  rpc ListRuleSets(ListRuleSetsRequest) returns (ListRuleSetsReply);
}

message JudgeRequest {
  string input_text = 1;
  RuleContext context = 2;
  string rule_set_id = 3;
}

message RuleContext {
  repeated ConversationTurn conversation = 1;
  repeated string indexed_roots = 2;
  WorktreeState worktree = 3;
  string cwd = 4;
  string cwd_indexed = 5; // "yes" | "no"
}

message ConversationTurn { string role = 1; string text = 2; }

message WorktreeState {
  string primary_checkout = 1;
  string default_branch = 2;
  repeated Worktree worktrees = 3;
  string current_worktree = 4;
  string current_branch = 5;
}
message Worktree { string path = 1; string branch = 2; bool is_primary = 3; }

message JudgeReply { Verdict verdict = 1; string reason = 2; float confidence = 3; }
enum Verdict { VERDICT_UNSPECIFIED = 0; VERDICT_BLOCK = 1; VERDICT_ALLOW = 2; }

message ListRuleSetsRequest {}
message ListRuleSetsReply { repeated RuleSetDescriptor rule_sets = 1; }
message RuleSetDescriptor {
  string id = 1;                        // "search-guard", "worktree-guard"
  repeated string required_context = 2; // "conversation","indexed_roots","worktree"
}
